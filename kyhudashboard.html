<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>monthly bills</title>
  <style>
    :root{
      --red:#c62828;
      --bg:#ffffff;
      --border:rgba(198,40,40,.25);
      --muted:rgba(0,0,0,.55);
    }
    body{
      margin:0;
      padding:40px;
      background:#f2f2f2;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;
    }
    .card{
      max-width:820px;
      margin:0 auto;
      background:var(--bg);
      border-radius:24px;
      padding:36px 40px;
      border:2px solid var(--border);
      box-shadow:0 20px 50px rgba(0,0,0,.12);
    }
    h1{
      margin:0 0 24px 0;
      color:var(--red);
      font-size:32px;
      letter-spacing:.3px;
    }
    .row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:16px 0;
      border-bottom:1px solid rgba(0,0,0,.08);
      font-size:20px;
    }
    .row:last-child{ border-bottom:none; }
    .label{
      color:#111;
      font-weight:500;
    }
    .amount{
      color:var(--red);
      font-weight:600;
    }
    .range{
      color:var(--muted);
      font-size:16px;
      margin-left:8px;
    }
    .total{
      margin-top:28px;
      padding-top:24px;
      border-top:2px dashed var(--border);
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:26px;
      font-weight:700;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>monthly bills</h1>

    <div class="row">
      <div class="label">rent</div>
      <div class="amount">$1,407</div>
    </div>

    <div class="row">
      <div class="label">state farm</div>
      <div class="amount">$178.33</div>
    </div>

    <div class="row">
      <div class="label">spectrum</div>
      <div class="amount">$85</div>
    </div>

    <div class="row">
      <div class="label">lg&e</div>
      <div class="amount">$80–$120<span class="range">variable</span></div>
    </div>

    <div class="row">
      <div class="label">crunch</div>
      <div class="amount">$58</div>
    </div>

    <div class="row">
      <div class="label">apple</div>
      <div class="amount">$2.99</div>
    </div>

    <div class="row">
      <div class="label">groceries</div>
      <div class="amount">$180</div>
    </div>

    <div class="row">
      <div class="label">car wash</div>
      <div class="amount">$27</div>
    </div>

    <div class="total">
      <div>estimated monthly total</div>
      <div class="amount">$2,018.32 – $2,058.32</div>
    </div>

  </div>
</body>
</html>
